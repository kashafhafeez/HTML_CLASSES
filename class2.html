<!DOCTYPE html>
<html>

<head>
    <title>HTML Class 2</title>
</head>

<body>

    <a href="https://www.google.com">Open Google</a>
    <!-- Link -->

    <br><br>

    <img src="https://via.placeholder.com/150" alt="Sample Image">
    <!-- Image -->

    <br><br>

    <button>Click Me</button>
    <!-- Button -->

    <h3>My Favorite Fruits</h3>

    <ul>
        <li>Apple</li>
        <!-- List item -->
        <li>Mango</li>
        <!-- List item -->
        <li>Banana</li>
        <!-- List item -->
    </ul>

    <!--
    a = link
    img = image
    button = button
    ul = unordered list
    li = list item
    -->

</body>

</html>
