<!DOCTYPE html>
<html>

<head>
    <title>HTML Advanced - Class 7</title>
</head>

<body>

    <!-- Advanced Table -->
    <h2>Student Scores</h2>
    <table border="1">
        <tr>
            <th rowspan="2">Name</th>
            <!-- Row span -->
            <th colspan="2">Subjects</th>
            <!-- Column span -->
        </tr>
        <tr>
            <th>Math</th>
            <th>Science</th>
        </tr>
        <tr>
            <td>Ali</td>
            <td>90</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Sara</td>
            <td>95</td>
            <td>88</td>
        </tr>
    </table>

    <br><br>

    <!-- Advanced Form -->
    <h2>Student Registration Form</h2>
    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name" required>
        <!-- Required + placeholder -->
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email" required>
        <br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter password" required>
        <br><br>

        <label>Age:</label>
        <input type="number" min="1" max="100" placeholder="Enter age">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <label>Skills:</label>
        <input type="checkbox"> HTML
        <input type="checkbox"> CSS
        <input type="checkbox"> JavaScript
        <br><br>

        <input type="submit" value="Register">
    </form>

    <!--
    table = advanced table
    th = table heading
    td = table data
    colspan = merge columns
    rowspan = merge rows
    form = form container
    input type=text/email/password/number = different input types
    placeholder = hint inside input
    required = mandatory field
    radio = choose one
    checkbox = choose multiple
    -->

</body>

</html>
