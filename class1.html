<!DOCTYPE html> <!-- this tag represent html5 version -->
<html> <!-- element is the root element of an HTML page -->

<head>    <!--element contains meta information about the HTML page-->
    <title>HTML Class 1</title>
    <!-- Browser tab title -->
</head>

<body>

    <h1>Welcome to HTML</h1>
    <!-- Main heading -->

    <h2>My First Web Page</h2>
    <!-- Small heading -->

    <p>HTML is used to create web pages.</p>
    <!-- Paragraph -->

    <p>I am learning HTML basics.</p>
    <!-- Another paragraph -->

    <p>Hello <br> World</p>
    <!-- Line break -->

    <hr>
    <!-- Horizontal line -->

    <p>This is my practice file.</p>
    <!-- Last paragraph -->

</body>

</html>
