<!DOCTYPE html>
<html>

<head>
    <title>HTML Class 5</title>
</head>

<body>

    <div id="header">
        <h1>My Website</h1>
    </div>
    <!-- div = section / box -->

    <div class="content">
        <p>My name is Kashaf.</p>
        <p>I am learning <span>HTML</span> now.</p>
    </div>
    <!-- class = same name for styling many elements -->
    <!-- id = unique name for one element -->
    <!-- span = style small part of text -->

    <div class="footer">
        <p>Thank you for visiting.</p>
    </div>

    <!--
    div = section / container
    span = small text part
    id = unique name
    class = common name for styling
    -->

</body>

</html>
