<!DOCTYPE html>
<html>

<head>
    <title>HTML Class 3</title>
</head>

<body>

    <h2>Student Table</h2>

    <table border="1">
        <tr>
            <th>Name</th>
            <!-- Table heading -->
            <th>Age</th>
            <!-- Table heading -->
            <th>City</th>
            <!-- Table heading -->
        </tr>

        <tr>
            <td>Ali</td>
            <!-- Table data -->
            <td>18</td>
            <!-- Table data -->
            <td>Karachi</td>
            <!-- Table data -->
        </tr>

        <tr>
            <td>Sara</td>
            <!-- Table data -->
            <td>19</td>
            <!-- Table data -->
            <td>Lahore</td>
            <!-- Table data -->
        </tr>
    </table>

    <br><br>

    <h2>Student Form</h2>

    <form>
        <label>Enter Name:</label>
        <!-- Label -->
        <input type="text">
        <!-- Text box -->

        <br><br>

        <label>Enter Email:</label>
        <!-- Label -->
        <input type="email">
        <!-- Email box -->

        <br><br>

        <label>Enter Password:</label>
        <!-- Label -->
        <input type="password">
        <!-- Password box -->

        <br><br>

        <input type="submit" value="Submit">
        <!-- Submit button -->
    </form>

    <!--
    table = table
    tr = table row
    th = table heading
    td = table data
    form = form
    label = text label
    input = input box
    submit = submit button
    -->

</body>

</html>
