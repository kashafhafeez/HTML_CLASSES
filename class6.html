<!DOCTYPE html>
<html>

<head>
    <title>HTML Advanced - Class 6</title>

    <!-- Meta tag -->
    <meta charset="UTF-8">
    <!-- Character encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Responsive -->
</head>

<body>

    <!-- Semantic header -->
    <header>
        <h1>My Advanced HTML Page</h1>
        <p>Using semantic tags for better structure</p>
    </header>

    <!-- Main content section -->
    <section>
        <h2>About Me</h2>
        <p>I am learning advanced HTML tags now.</p>
    </section>

    <!-- Article example -->
    <article>
        <h2>My First Article</h2>
        <p>This is an example of an article tag.</p>
    </article>

    <!-- Audio Example -->
    <section>
        <h2>Listen Music</h2>
        <audio controls>
            <source src="sample-audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </section>

    <!-- Video Example -->
    <section>
        <h2>Watch Video</h2>
        <video width="320" height="240" controls>
            <source src="sample-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>

    <!-- iFrame Example -->
    <section>
        <h2>Google Map</h2>
        <iframe src="https://www.google.com/maps" width="400" height="300"></iframe>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <!--
    header = page header section
    section = main content block
    article = article or post
    audio = play audio
    video = play video
    iframe = embed external page
    meta = page information
    footer = page footer
    -->

</body>

</html>
