<!DOCTYPE html>
<html>

<head>
    <title>HTML Class 4</title>
</head>

<body>

    <h2>Student Information Form</h2>

    <form>

        <label>Select Gender:</label><br>
        <input type="radio" name="gender"> Male
        <!-- Radio button -->
        <input type="radio" name="gender"> Female
        <!-- Radio button -->

        <br><br>

        <label>Select Skills:</label><br>
        <input type="checkbox"> HTML
        <!-- Checkbox -->
        <input type="checkbox"> CSS
        <!-- Checkbox -->
        <input type="checkbox"> JavaScript
        <!-- Checkbox -->

        <br><br>

        <label>Select City:</label><br>
        <select> <!-- Dropdown -->
            <option>Karachi</option> <!-- Dropdown option -->
            <option>Lahore</option> <!-- Dropdown option -->
            <option>Islamabad</option> <!-- Dropdown option -->
        </select>

        <br><br>

        <label>Write About Yourself:</label><br>
        <textarea rows="5" cols="30"></textarea>
        <!-- Text area -->

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <!--
    radio = choose one option
    checkbox = choose multiple options
    select = dropdown
    option = dropdown item
    textarea = large text box
    -->

</body>

</html>
